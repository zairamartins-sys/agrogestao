<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6ef;--sf:#fff;--tx:#1b2910;--mu:#5d6c52;--g:#3f8a22;--gt:#fff;--bd:#e0e7d8;--rd:#c2412d;--dk:#2a3b17;--lg:#6db33f;--gd:#e3a01c;--tl:#2c7a85;--okb:#e2f3d6;--okt:#2c6a14;--wb:#fcefd0;--wt:#8a5a05;--bb:#f9dfd9;--bt:#a3321f;--ib:#d9eef0;--it:#1f6169;--sh:0 1px 2px rgba(31,53,16,.06),0 8px 22px rgba(31,53,16,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f180a;--sf:#192512;--tx:#e8f0e1;--mu:#9bab90;--g:#6db33f;--gt:#0f1a09;--bd:#2b3b21;--rd:#f08a78;--okb:#223a17;--okt:#9bdc72;--wb:#3d3010;--wt:#f0c565;--bb:#43201a;--bt:#f19a8b;--ib:#17363a;--it:#86ccd4;--sh:0 1px 2px #0006,0 8px 22px #0004}}
:root[data-theme="dark"]{--bg:#0f180a;--sf:#192512;--tx:#e8f0e1;--mu:#9bab90;--g:#6db33f;--gt:#0f1a09;--bd:#2b3b21;--rd:#f08a78;--okb:#223a17;--okt:#9bdc72;--wb:#3d3010;--wt:#f0c565;--bb:#43201a;--bt:#f19a8b;--ib:#17363a;--it:#86ccd4;--sh:0 1px 2px #0006,0 8px 22px #0004}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
nav{width:240px;background:linear-gradient(180deg,#2f4519 0%,#22330f 100%);color:#e9f2e1;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{background:#fff;border-radius:14px;padding:10px 12px 8px;margin:0 0 18px;text-align:center;box-shadow:0 4px 14px #0003}.brand img{display:block;width:100%;max-width:150px;margin:0 auto}.brand span{display:block;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#2a3b17}.brand small{display:block;font-size:11px;color:#5d6c52;font-weight:500}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:3px;border-radius:10px;color:#d9e6cf;cursor:pointer;font-size:14px;font-weight:500;position:relative;transition:background .18s,color .18s,transform .18s}nav a svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:#ffffff14;color:#fff}nav a.on{background:linear-gradient(90deg,#6db33f,#4f9a2c);color:#fff;font-weight:700;box-shadow:0 4px 12px #0004}nav a.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#e3a01c}
main{flex:1;min-width:0;padding:26px 30px;max-width:1360px;margin:0 auto;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{margin:0 0 16px;font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--tx)}h2:after{content:"";display:block;width:44px;height:4px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,var(--lg),var(--gd))}h3{margin:6px 0 10px;font-size:15px;font-weight:700}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh);animation:fi .4s ease both}
.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:18px}.k div{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--lg);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}.k div:hover{transform:translateY(-2px)}
.k div.c1{border-left-color:var(--gd)}.k div.c2{border-left-color:var(--dk)}.k div.c3{border-left-color:var(--tl)}
.k b{display:block;font-size:26px;font-weight:800;line-height:1.15;color:var(--tx)}.k span{font-size:12px;color:var(--mu);font-weight:500}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;max-width:100%;transition:border-color .15s,box-shadow .15s,background .15s,transform .15s}
button{cursor:pointer;font-weight:600}button:hover{border-color:var(--g);transform:translateY(-1px)}button:active{transform:none}button.p{background:linear-gradient(135deg,#6db33f,#3f8a22);color:#fff;border-color:transparent;box-shadow:0 3px 10px #3f8a2240}button.p:hover{filter:brightness(1.07)}button.d{color:var(--rd);border-color:transparent;background:transparent}button.d:hover{background:var(--bb);border-color:transparent}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--lg);box-shadow:0 0 0 3px #6db33f40}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tb .on{background:var(--dk);color:#fff;border-color:var(--dk);box-shadow:inset 0 -3px 0 var(--gd)}
.w{overflow-x:auto;border-radius:12px;margin-bottom:18px}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--lg) 8%,var(--sf))}tr:hover td{background:color-mix(in srgb,var(--lg) 7%,transparent)}
.kb{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}.kb>div{min-width:220px;background:color-mix(in srgb,var(--lg) 6%,var(--bg));border:1px solid var(--bd);border-top:4px solid var(--lg);border-radius:14px;padding:10px}.kb>div:nth-child(4n+2){border-top-color:var(--gd)}.kb>div:nth-child(4n+3){border-top-color:var(--dk)}.kb>div:nth-child(4n){border-top-color:var(--tl)}.kb h4{margin:2px 2px 10px;font-size:13px;font-weight:700}
.kc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px;box-shadow:var(--sh);transition:transform .18s}.kc:hover{transform:translateY(-2px)}.kc select{width:100%;margin-top:8px;font-size:12px}
.br{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.br i{display:block;height:14px;background:linear-gradient(90deg,var(--lg),var(--g));border-radius:8px;min-width:3px;transition:width .6s ease}.br em{width:120px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;color:var(--mu)}.br div{flex:1;background:var(--bd);border-radius:8px;overflow:hidden}.br b{min-width:38px;text-align:right}
.dn{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.lg i{width:12px;height:12px;border-radius:4px;flex:none}.lg b{margin-left:auto;padding-left:14px}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(560px,94vw);max-height:90vh;padding:22px;box-shadow:0 20px 60px #0006;animation:fi .25s ease}dialog::backdrop{background:#10200a99;backdrop-filter:blur(3px)}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin:12px 0 4px}dialog input,dialog select,dialog textarea{width:100%}
.tg{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--bd);color:var(--mu);font-size:12px;font-weight:700}.tg.ok{background:var(--okb);color:var(--okt)}.tg.warn{background:var(--wb);color:var(--wt)}.tg.bad{background:var(--bb);color:var(--bt)}.tg.info{background:var(--ib);color:var(--it)}.mu{color:var(--mu)}
@media(max-width:900px){main{padding:18px}}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;overflow-x:auto;padding:8px 10px}.brand{margin:0 8px 0 0;padding:4px 8px;flex:none;border-radius:10px}.brand img{width:60px}.brand span,.brand small{display:none}nav a{white-space:nowrap;margin:0;padding:9px 12px}nav a.on:before{display:none}nav a svg{display:none}main{padding:14px}h2{font-size:20px}}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.g2 .card{margin-bottom:0}.g2{margin-bottom:16px}.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:8px}.lgd i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:16px 0}.g3 .card{margin-bottom:0}.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ms b{display:block;font-size:24px;font-weight:800;line-height:1.15}.ms span{font-size:11px;color:var(--mu);font-weight:500}
.al{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.al a{display:block;cursor:pointer;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--lg) 6%,var(--sf));transition:transform .18s}.al a:hover{transform:translateY(-2px)}.al a b{display:block;font-size:24px;font-weight:800}.al a span{font-size:12px;color:var(--mu)}.al a.hot{background:var(--wb);border-color:transparent}.al a.hot b,.al a.hot span{color:var(--wt)}
.ng{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9bb38a;margin:16px 10px 6px}.crumb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin-bottom:4px}
@media(max-width:760px){.ng{flex:none;margin:0 2px 0 12px;white-space:nowrap;color:#b9d6a3}nav a{flex:none}}.mc{display:flex;flex-direction:column}.mc .tb{margin-top:auto!important;padding-top:14px}

.login{max-width:420px;margin:8vh auto}.login img{display:block;max-width:190px;margin:0 auto 16px}.login input{width:100%;margin-bottom:10px}.login button.p{width:100%;padding:11px}.login .lk{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px}.login .lk a{color:var(--g);font-weight:700;cursor:pointer}.login .msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px;background:var(--bb);color:var(--bt)}.login .msg.ok{background:var(--okb);color:var(--okt)}
.usr{margin-top:20px;padding:12px 10px;border-top:1px solid #ffffff22;font-size:12px;color:#c3d6b4}.usr b,.usr span{display:block}.usr b{color:#fff;font-size:13px}.usr button{margin-top:8px;background:#ffffff14;color:#fff;border-color:#ffffff30}
@media(max-width:760px){.usr{flex:none;display:flex;gap:8px;align-items:center;margin:0 0 0 8px;padding:0 6px;border:0}.usr span{display:none}.usr button{margin:0}}

 e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=authMode,btn=e.target.querySelector('button');btn.disabled=true;
 try{
  if(m==='in'){const{error}=await SB.auth.signInWithPassword({email:f.email.trim().toLowerCase(),password:f.senha});if(error)throw error;await enter()}
  else if(m==='up'){if(f.senha!==f.senha2)throw new Error('As senhas não conferem.');const{data,error}=await SB.auth.signUp({email:f.email.trim().toLowerCase(),password:f.senha,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;authMode='in';authUI('Enviamos um e-mail de confirmação. Abra o link e depois entre com o seu e-mail e a sua senha.',true)}
  else if(m==='rec'){const{error}=await SB.auth.resetPasswordForEmail(f.email.trim().toLowerCase(),{redirectTo:location.origin+location.pathname});if(error)throw error;authMode='in';authUI('Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.',true)}
  else if(m==='new'){if(f.senha!==f.senha2)throw new Error('As senhas não conferem.');const{error}=await SB.auth.updateUser({password:f.senha});if(error)throw error;authMode='in';history.replaceState(null,'',location.pathname);await enter()}
 }catch(x){const t=String(x.message||x);authUI(/invalid login/i.test(t)?'E-mail ou senha incorretos. No primeiro acesso, use “Primeiro acesso” para criar a sua senha.':/rate limit|exceeded/i.test(t)?'Muitos e-mails enviados em pouco tempo. Aguarde um pouco e tente de novo.':t)}
}
async function enter(){
 if(entering)return;entering=true;
 try{
  const{data,error}=await SB.rpc('meu_perfil');if(error)throw error;ME=(data||[])[0]||null;
  if(!ME){authUI('Este e-mail ainda não está cadastrado na equipe ou foi desativado. Peça à gestão para cadastrar o seu e-mail.',false,true);return}
  $('#nv').style.display='';$('#m').innerHTML='<p class="mu">Carregando…</p>';
  await Promise.all(COL.map(load));view='home';render();
  clearInterval(poll);poll=setInterval(()=>{if(ME&&!document.hidden)refreshAll()},30000);
 }catch(x){authUI('Não foi possível carregar os dados: '+(x.message||x))}
 finally{entering=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)refreshAll()});
SB.auth.onAuthStateChange((ev,s)=>{
 if(ev==='PASSWORD_RECOVERY'){authMode='new';authUI();return}
 if(ev==='SIGNED_OUT'){ME=null;clearInterval(poll);D={};COL.forEach(c=>D[c]=[]);D.colegas=[];authMode='in';authUI();return}
 if(ev==='SIGNED_IN'&&!ME&&authMode!=='new'&&!entering)setTimeout(enter,0);
});
(async()=>{
 if(/type=recovery/.test(location.hash)){authMode='new';authUI();return}
 const{data:{session}}=await SB.auth.getSession();
 if(!session){authUI();return}
 await enter();
})();

/* ===== Filtro de período nos dashboards ===== */
let PER={t:'tudo',ref:today()};
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const perRange=()=>{if(PER.t==='tudo')return null;const r=new Date(PER.ref+'T00:00:00');let a,b;
 if(PER.t==='semana'){a=new Date(r);a.setDate(r.getDate()-((r.getDay()+6)%7));b=new Date(a);b.setDate(a.getDate()+6)}
 else if(PER.t==='mes'){a=new Date(r.getFullYear(),r.getMonth(),1);b=new Date(r.getFullYear(),r.getMonth()+1,0)}
 else{const q=Math.floor(r.getMonth()/3);a=new Date(r.getFullYear(),q*3,1);b=new Date(r.getFullYear(),q*3+3,0)}
 return[ymd(a),ymd(b)]};
const fd=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const perLabel=()=>{const R=perRange();if(!R)return'Todo o período';const a=new Date(R[0]+'T00:00:00');
 if(PER.t==='semana')return'Semana de '+fd(R[0]).slice(0,5)+' a '+fd(R[1]);
 if(PER.t==='mes')return MN[a.getMonth()][0].toUpperCase()+MN[a.getMonth()].slice(1)+' de '+a.getFullYear();
 return(Math.floor(a.getMonth()/3)+1)+'º trimestre de '+a.getFullYear()+' ('+MN[a.getMonth()].slice(0,3)+'–'+MN[a.getMonth()+2].slice(0,3)+')'};
function perSet(k){PER.t=k;if(k!=='tudo'&&!PER.ref)PER.ref=today();render()}
function perMove(n){const r=new Date(PER.ref+'T00:00:00');if(PER.t==='semana')r.setDate(r.getDate()+7*n);else if(PER.t==='mes')r.setMonth(r.getMonth()+n,1);else r.setMonth(r.getMonth()+3*n,1);PER.ref=ymd(r);render()}
function perRef(v){if(v){PER.ref=v.length===7?v+'-01':v}render()}
function perYears(){const ys=[+today().slice(0,4)];[...D.tasks.map(t=>t.fim||t.inicio),...D.leads.map(l=>l.entrada),...D.projects.map(p=>p.inicio),...[...D.chs,...D.fb,...D.leads,...D.projects,...D.tasks].map(r=>r.criado)].forEach(d=>{const y=+String(d||'').slice(0,4);if(y>2000&&y<2100)ys.push(y)});const lo=Math.min(...ys),hi=Math.max(...ys);return Array.from({length:hi-lo+1},(_,i)=>lo+i)}
function perPick(){const R=perRange();if(!R)return'';const a=new Date(R[0]+'T00:00:00'),Y=perYears();
 if(PER.t==='mes'){const cur=R[0].slice(0,7);return`<select onchange="perRef(this.value)">${Y.flatMap(y=>MN.map((m,i)=>[y+'-'+p2(i+1),m[0].toUpperCase()+m.slice(1)+' de '+y])).map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('')}</select>`}
 if(PER.t==='trimestre'){const cur=a.getFullYear()+'-'+p2(Math.floor(a.getMonth()/3)*3+1);return`<select onchange="perRef(this.value)">${Y.flatMap(y=>[0,1,2,3].map(q=>[y+'-'+p2(q*3+1),(q+1)+'º trimestre de '+y+' ('+MN[q*3].slice(0,3)+'–'+MN[q*3+2].slice(0,3)+')'])).map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('')}</select>`}
 return`<input type="date" value="${PER.ref}" onchange="perRef(this.value)" title="Escolha qualquer dia: mostra a semana dele"><b>${perLabel()}</b>`}
function perHoje(){PER.ref=today();render()}
const perBar=()=>{const R=perRange();return`<div class="tb"><span class="mu"><b>Período:</b></span>${[['tudo','Tudo'],['semana','Semana'],['mes','Mês'],['trimestre','Trimestre']].map(([k,l])=>`<button class="${PER.t===k?'on':''}" onclick="perSet('${k}')">${l}</button>`).join('')}${R?`<button onclick="perMove(-1)" title="Período anterior">‹</button>${perPick()}<button onclick="perMove(1)" title="Próximo período">›</button><button onclick="perHoje()">Hoje</button>`:''}</div>${R?`<p class="mu" style="margin:-4px 0 12px">${{dashM:'IRI recalculado com as tarefas do período (pela data de término). Membros ativos mostra a situação atual.',dashL:'Leads pela data de entrada · projetos ativos no período · tarefas pela data de término.',dashF:'CHS, NPS e CSAT pela data do registro.'}[view]||'Leads pela data de entrada · projetos ativos no período · tarefas pela data de término · CHS, NPS e CSAT pela data do registro.'}</p>`:''}`};
function perD(){const R=perRange(),dOf=r=>(r.criado||'').slice(0,10),inP=d=>d&&d>=R[0]&&d<=R[1];
 return{...D,leads:D.leads.filter(l=>inP(l.entrada||dOf(l))),projects:D.projects.filter(p=>(p.inicio||dOf(p)||'0')<=R[1]&&(p.prazo||'9999')>=R[0]),tasks:D.tasks.filter(t=>inP(t.fim||t.inicio||dOf(t))),chs:D.chs.filter(r=>inP(dOf(r))),fb:D.fb.filter(r=>inP(dOf(r)))}}
function withPer(fn){const R=perRange();let h;if(!R)h=fn();else{const D0=D;D=perD();D.evals=iriRows().filter(e=>isL()||e.membro===ME.id);try{h=fn()}finally{D=D0}}return h.replace('</h2>','</h2>'+perBar())}
const VP=()=>['dashM','dashL','dashF','home'].includes(view)?withPer(()=>V[view]()):V[view]();
